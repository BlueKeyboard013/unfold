databases:
  - name: unfold-db
    databaseName: unfold
    user: unfold
    plan: free

services:
  - type: web
    name: unfold-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://unfold-api.onrender.com

  - type: web
    name: unfold-api
    env: docker
    dockerfilePath: ./services/style-profile-service/Dockerfile
    dockerContext: ./services/style-profile-service
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: unfold-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: unfold-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: unfold-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: unfold-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: unfold-db
          property: password
      - key: UNFOLD_ALLOWED_ORIGINS
        value: https://unfold-web.onrender.com,http://localhost:5173
