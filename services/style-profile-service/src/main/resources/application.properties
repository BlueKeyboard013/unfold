spring.application.name=style-profile-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unfold}
spring.datasource.username=${DB_USER:unfold}
spring.datasource.password=${DB_PASSWORD:unfold}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

unfold.allowed-origins=${UNFOLD_ALLOWED_ORIGINS:http://localhost:5173}
